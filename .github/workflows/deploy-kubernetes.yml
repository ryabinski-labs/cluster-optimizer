name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy.
        default: latest
        required: true
        type: string
      cluster_id:
        description: Logical cluster identifier in reports.
        default: default
        required: true
        type: string
      enable_dynamodb:
        description: Persist reports to DynamoDB.
        default: true
        required: true
        type: boolean
      dynamodb_table:
        description: DynamoDB table name.
        default: cluster-optimizer-reports
        required: true
        type: string
      aws_region:
        description: AWS region for DynamoDB.
        default: us-east-1
        required: true
        type: string
      doks_cluster_id:
        description: DigitalOcean Kubernetes cluster ID.
        default: 7dc99f7c-e0b7-4402-81ae-0e9a1fedcd82
        required: true
        type: string
      enable_live_apply:
        description: >-
          Live applier: patch workload requests in-cluster. On by default.
          Requires DynamoDB persistence and manifests/rbac-applier.yaml.
        default: true
        required: true
        type: boolean
      enable_live_nudge:
        description: >-
          Live nudger: cordon a node and evict its relocatable pods when
          consolidation is feasible. On by default. Requires DynamoDB
          persistence, whose manifest is the only one carrying the gate.
        default: true
        required: true
        type: boolean
      enable_live_gc:
        description: >-
          Live completed-pod GC: delete Succeeded/Failed pods instead of only
          listing them. On by default. Requires DynamoDB persistence, whose
          manifest is the only one carrying the gate.
        default: true
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ryabinski-labs/cluster-optimizer

jobs:
  deploy:
    name: Deploy CronJob
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Validate DigitalOcean token secret
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          test -n "${DIGITALOCEAN_ACCESS_TOKEN}" || {
            echo "DIGITALOCEAN_ACCESS_TOKEN secret is required to deploy to Kubernetes."
            exit 1
          }

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubeconfig
        env:
          DOKS_CLUSTER_ID: ${{ inputs.doks_cluster_id }}
        run: |
          doctl kubernetes cluster kubeconfig save "${DOKS_CLUSTER_ID}" --expiry-seconds 600
          kubectl cluster-info

      - name: Validate deployment inputs
        env:
          ENABLE_DYNAMODB: ${{ inputs.enable_dynamodb }}
          ENABLE_LIVE_APPLY: ${{ inputs.enable_live_apply }}
          ENABLE_LIVE_NUDGE: ${{ inputs.enable_live_nudge }}
          ENABLE_LIVE_GC: ${{ inputs.enable_live_gc }}
        run: |
          for gate in ENABLE_LIVE_APPLY ENABLE_LIVE_NUDGE ENABLE_LIVE_GC; do
            if [ "${!gate}" = "true" ] && [ "${ENABLE_DYNAMODB}" != "true" ]; then
              echo "${gate} requires enable_dynamodb; the stdout-only manifest cannot run live remediation safely."
              exit 1
            fi
          done

      - name: Apply engine RBAC
        run: bash scripts/apply-rbac.sh

      - name: Configure optional GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "GHCR_PULL_TOKEN not set; assuming the image is public or nodes can already pull it."
            exit 0
          fi

          kubectl create secret docker-registry ghcr-pull \
            -n cluster-optimizer \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password "${GHCR_PULL_TOKEN}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          kubectl patch serviceaccount cluster-optimizer \
            -n cluster-optimizer \
            --type merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Configure DynamoDB Secret
        if: ${{ inputs.enable_dynamodb }}
        env:
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.CLUSTER_OPTIMIZER_AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.CLUSTER_OPTIMIZER_AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "${APP_AWS_ACCESS_KEY_ID}" || {
            echo "CLUSTER_OPTIMIZER_AWS_ACCESS_KEY_ID secret is required when DynamoDB is enabled."
            exit 1
          }
          test -n "${APP_AWS_SECRET_ACCESS_KEY}" || {
            echo "CLUSTER_OPTIMIZER_AWS_SECRET_ACCESS_KEY secret is required when DynamoDB is enabled."
            exit 1
          }
          kubectl create secret generic cluster-optimizer-aws \
            -n cluster-optimizer \
            --from-literal=AWS_ACCESS_KEY_ID="${APP_AWS_ACCESS_KEY_ID}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${APP_AWS_SECRET_ACCESS_KEY}" \
            --from-literal=AWS_REGION="${{ inputs.aws_region }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Configure applier RBAC
        env:
          ENABLE_LIVE_APPLY: ${{ inputs.enable_live_apply }}
        run: |
          if [ "${ENABLE_LIVE_APPLY}" = "true" ]; then
            bash scripts/apply-rbac.sh --applier
          else
            bash scripts/apply-rbac.sh --revoke-applier
          fi

      - name: Deploy CronJob
        env:
          ENABLE_DYNAMODB: ${{ inputs.enable_dynamodb }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CLUSTER_ID: ${{ inputs.cluster_id }}
          DYNAMODB_TABLE: ${{ inputs.dynamodb_table }}
          ENABLE_LIVE_APPLY: ${{ inputs.enable_live_apply }}
          ENABLE_LIVE_NUDGE: ${{ inputs.enable_live_nudge }}
          ENABLE_LIVE_GC: ${{ inputs.enable_live_gc }}
        run: |
          manifest="manifests/cronjob.yaml"
          if [ "${ENABLE_DYNAMODB}" = "true" ]; then
            manifest="examples/cronjob-dynamodb.yaml"
          fi

          # The manifests ship with every live gate set to "false" so that a
          # plain `kubectl apply -f` is always advisory. Turning one on is a
          # deploy-time decision, not a change to the committed manifest.
          gate() {
            if [ "$2" = "true" ]; then
              sed "/name: $1\$/{n;s/value: \"false\"/value: \"true\"/;}"
            else
              cat
            fi
          }

          kubectl patch --local -f "${manifest}" --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/jobTemplate/spec/template/spec/containers/0/image\",\"value\":\"${IMAGE_NAME}:${IMAGE_TAG}\"}]" \
            -o yaml |
            sed "s/value: \"default\"/value: \"${CLUSTER_ID}\"/" |
            sed "s/value: cluster-optimizer-reports/value: ${DYNAMODB_TABLE}/" |
            gate CLUSTER_OPTIMIZER_AUTOAPPLY "${ENABLE_LIVE_APPLY}" |
            gate CLUSTER_OPTIMIZER_NUDGE_LIVE "${ENABLE_LIVE_NUDGE}" |
            gate CLUSTER_OPTIMIZER_GC_COMPLETED_PODS_LIVE "${ENABLE_LIVE_GC}" |
            kubectl apply -f -

      - name: Show deployment
        run: |
          kubectl get cronjob -n cluster-optimizer cluster-optimizer
          kubectl get serviceaccount -n cluster-optimizer cluster-optimizer

          echo "Live gates as deployed:"
          kubectl get cronjob -n cluster-optimizer cluster-optimizer \
            -o jsonpath='{range .spec.jobTemplate.spec.template.spec.containers[0].env[?(@.value)]}{.name}={.value}{"\n"}{end}' |
            grep -E 'AUTOAPPLY|NUDGE_LIVE|GC_COMPLETED_PODS_LIVE' || true
