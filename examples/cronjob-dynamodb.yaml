apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-optimizer
  namespace: cluster-optimizer
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-optimizer
        spec:
          serviceAccountName: cluster-optimizer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: optimizer
              image: ghcr.io/ryabinski-labs/cluster-optimizer:latest
              imagePullPolicy: IfNotPresent
              args: ["--output", "json", "--auto-apply", "--nudge", "--gc-completed-pods"]
              env:
                - name: CLUSTER_OPTIMIZER_CLUSTER_ID
                  value: "default"
                - name: DYNAMODB_TABLE
                  value: cluster-optimizer-reports
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: cluster-optimizer-aws
                      key: AWS_REGION
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cluster-optimizer-aws
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cluster-optimizer-aws
                      key: AWS_SECRET_ACCESS_KEY
                # Keep scheduled analysis and DynamoDB history enabled while
                # requiring an explicit deployment change for live mutation.
                - name: CLUSTER_OPTIMIZER_AUTOAPPLY
                  value: "false"
                - name: CLUSTER_OPTIMIZER_NUDGE_LIVE
                  value: "false"
                - name: CLUSTER_OPTIMIZER_GC_COMPLETED_PODS_LIVE
                  value: "false"
                # Minimum-safe-node search. These only affect the advisory
                # verdict; nothing here mutates the cluster.
                #
                # Without a Prometheus URL the engine falls back to a single
                # live metrics-server sample, still reports a verdict, and
                # marks it advisory — one sample cannot tell an idle workload
                # from one caught between bursts, so it never authorises
                # removing a node.
                # - name: CLUSTER_OPTIMIZER_PROMETHEUS_URL
                #   value: "http://prometheus-operated.monitoring:9090"
                # - name: CLUSTER_OPTIMIZER_USAGE_LOOKBACK
                #   value: "168h"
                #
                # Floor can only make the answer safer: it never lowers the
                # minimum the placement simulation derived.
                # - name: CLUSTER_OPTIMIZER_NODE_FLOOR
                #   value: "2"
                #
                # Require the recommended node count to still place every pod
                # after losing one node. On by default; turning it off trades
                # the "safe" out of "minimum safe".
                # - name: CLUSTER_OPTIMIZER_SURVIVE_NODE_LOSS
                #   value: "true"
                #
                # How long a cordon this tool placed may stand before the next
                # run reverses it and gives the capacity back. Covers both a
                # run that died mid-drain and a drain nothing ever acted on.
                # Set to 0 to never reap.
                # - name: CLUSTER_OPTIMIZER_CORDON_TTL
                #   value: "30m"
              volumeMounts:
                - name: targets
                  mountPath: /etc/cluster-optimizer
                  readOnly: true
              resources:
                requests:
                  cpu: 1m
                  memory: 1Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: targets
              configMap:
                name: cluster-optimizer-targets
